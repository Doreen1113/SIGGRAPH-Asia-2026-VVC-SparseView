# Modified by Team Doreen071 for the SIGGRAPH Asia 2026 VVC Sparse-View track (2026-09); see MODIFICATIONS.md.
[project]
name = "ftgspp"
version = "0.1.0"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.12.*"
# `gsplat` is intentionally excluded from automatic dependency resolution.
# Install gsplat==1.5.3 separately from upstream under its own Apache-2.0
# license.
dependencies = [
    "imagecodecs>=2025.8.2",
    "imageio>=2.37.0",
    "hydra-core>=1.3.4,<1.4",
    "msgspec>=0.19.0",
    "numpy>=2.2.6",
    "omegaconf>=2.3.1,<2.4",
    "opencv-python-headless>=4.11.0.86",
    "pillow>=11.3.0",
    "pycolmap==3.12.3",
    "rerun-sdk>=0.24.1",
    "scipy>=1.16.1",
    "setuptools==80.9.0",
    "torch==2.5.1+cu121",
    "torchmetrics>=1.8.1",
    "torchvision==0.20.1+cu121",
    "tqdm>=4.67.1",
    "flip-evaluator>=1.6.0.1",
    "av>=14.0.0",
    "memfof",
    "tinycudann>=2.0",
    "tensorboard>=2.21.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[dependency-groups]
with-torch = [
    "fused-local-corr==0.2.4",
    "fused-ssim",
    "romatch[fused-local-corr]",
    "romav2",
]

[tool.setuptools.packages.find]
include = ["ftgspp*"]

[tool.pyright]
venv = ".venv"
venvPath = "."

[tool.uv.extra-build-dependencies]
romatch = ["uv_build"]
romav2 = ["uv_build"]

[tool.uv]
no-build-isolation-package = ["fused-local-corr", "fused-ssim", "romatch", "tinycudann"]
# RoMaV2 works with the project's tested torchvision build, although its
# upstream metadata currently requires a newer torchvision release.
override-dependencies = ["torchvision==0.20.1+cu121"]

[tool.uv.sources]
fused-ssim = { git = "https://github.com/MrNeRF/optimized-fused-ssim" }
fused-local-corr = { git = "https://github.com/Parskatt/fused-local-corr", tag = "v0.2.4" }
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
romatch = { git = "https://github.com/Parskatt/RoMa", tag = "v0.1.2" }
romav2 = { git = "https://github.com/Parskatt/RoMaV2", tag = "v2.0.1" }
tinycudann = { git = "https://github.com/yklcs/tiny-cuda-nn", subdirectory = "bindings/torch" }
memfof = { git = "https://github.com/msu-video-group/memfof" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.dependency-metadata]]
name = "fused-ssim"
version = "0.0.0"
requires-dist = ["setuptools", "torch"]
